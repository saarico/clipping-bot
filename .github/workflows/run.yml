name: run
on:
  schedule:
    - cron: "7 */5 * * *"      # every 5 hours
  workflow_dispatch:
    inputs:
      campaign:
        description: "Only this campaign folder (blank = all)"
        required: false
        default: ""
concurrency:
  group: clipping-run
  cancel-in-progress: false
permissions:
  contents: write

# Four stages so that every clip is cut on its own machine (rico, 2026-10-28: "speed it up 20x"; 2026-10-30: "15 min"):
#   transcribe  4 machines beside prepare: a quarter of the episode each (only when the transcript is new) -> artifact "words-N"
#   prepare     one machine: Drive -> brief, episode (cache), graphics map, merges the transcript parts, the picks -> artifact "prep"
#   render      one machine per candidate (up to 4 at once): render + QA + judge     -> artifact "clip-N"
#   collect     one machine: keep up to 3, upload to 1_CHECK + SUMMARY, commit state
jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: ffmpeg + rclone
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: deps
        run: pip install -q -r requirements.txt
      - name: whisper model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: transcribe part
        env:
          RCLONE_TOKEN: ${{ secrets.RCLONE_TOKEN }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          CAMPAIGN: ${{ inputs.campaign }}
        run: |
          set -o pipefail
          mkdir -p /tmp/clipwork/words
          python bot/run.py "$CAMPAIGN" --phase transcribe --part ${{ matrix.part }} --parts 4 2>&1 | tee /tmp/clipwork/words/log_${{ matrix.part }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: words-${{ matrix.part }}
          path: /tmp/clipwork/words
          retention-days: 1
          if-no-files-found: warn

  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      count: ${{ steps.prep.outputs.count }}
      jobs: ${{ steps.prep.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: ffmpeg + rclone
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: deps
        run: pip install -q -r requirements.txt
      - name: browser cache (for rules pages that need JavaScript, e.g. Notion)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1
      - name: browser
        run: |
          (python -m playwright install --with-deps chromium || python -m playwright install chromium) 2>&1 | tail -n 5 | tee data/setup.log
      - name: whisper model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: prepare
        id: prep
        env:
          RCLONE_TOKEN: ${{ secrets.RCLONE_TOKEN }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          GH_TOKEN: ${{ github.token }}      # to fetch the transcript parts (artifacts words-N) while the run is still going
          CAMPAIGN: ${{ inputs.campaign }}   # through env, never inlined: a "$" in a name ("TJR $23,100 ...") was shell-expanded
        run: |
          set -o pipefail
          python bot/run.py "$CAMPAIGN" --phase prepare 2>&1 | tee data/prepare.log
          grep -q '^count=' "$GITHUB_OUTPUT" || { echo "count=0" >> "$GITHUB_OUTPUT"; echo "jobs=[]" >> "$GITHUB_OUTPUT"; }
      - uses: actions/upload-artifact@v4
        if: steps.prep.outputs.count != '0'
        with:
          name: prep
          path: /tmp/clipwork/prep
          retention-days: 1
          include-hidden-files: true
      - name: save state
        if: always()
        run: |
          git config user.name "clipping-bot"
          git config user.email "clipping-bot@users.noreply.github.com"
          git add campaigns data
          git diff --cached --quiet || (git commit -m "prepare $(date -u +%Y-%m-%d_%H:%M)" && git pull --rebase origin main && git push)

  render:
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJson(needs.prepare.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: ffmpeg + rclone
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: deps
        run: pip install -q -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: prep
          path: /tmp/clipwork/prep
      - name: render
        env:
          RCLONE_TOKEN: ${{ secrets.RCLONE_TOKEN }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          set -o pipefail
          mkdir -p /tmp/clipwork/out/${{ matrix.job }}
          python bot/run.py --phase render --job ${{ matrix.job }} 2>&1 | tee /tmp/clipwork/out/${{ matrix.job }}/render.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clip-${{ matrix.job }}
          path: /tmp/clipwork/out/${{ matrix.job }}
          retention-days: 3
          include-hidden-files: true

  collect:
    needs: [prepare, render]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: deps
        run: pip install -q -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: prep
          path: /tmp/clipwork/prep
      - uses: actions/download-artifact@v4
        with:
          pattern: clip-*
          path: /tmp/clipwork/out
      - name: collect
        env:
          RCLONE_TOKEN: ${{ secrets.RCLONE_TOKEN }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          set -o pipefail
          cat data/prepare.log > data/last_run.log || true
          python bot/run.py --phase collect 2>&1 | tee -a data/last_run.log
      - name: save state
        if: always()
        run: |
          git config user.name "clipping-bot"
          git config user.email "clipping-bot@users.noreply.github.com"
          git add campaigns data
          git diff --cached --quiet || (git commit -m "run $(date -u +%Y-%m-%d_%H:%M)" && git pull --rebase origin main && git push)
