name: run
on:
  schedule:
    - cron: "7 */5 * * *"      # every 5 hours
  workflow_dispatch:
    inputs:
      campaign:
        description: "Only this campaign folder (blank = all)"
        required: false
        default: ""
concurrency:
  group: clipping-run
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: deps
        run: pip install -q -r requirements.txt
      - name: whisper model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: run
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: python bot/run.py "${{ inputs.campaign }}"
      - name: save state
        if: always()
        run: |
          git config user.name "clipping-bot"
          git config user.email "clipping-bot@users.noreply.github.com"
          git add campaigns data
          git diff --cached --quiet || (git commit -m "run $(date -u +%Y-%m-%d_%H:%M)" && git push)
