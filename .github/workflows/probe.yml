name: probe
# One-off check from the runner (the sandbox cannot reach YouTube): can yt-dlp read this video?
on:
  workflow_dispatch:
    inputs:
      url:
        description: video URL to probe
        required: true
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -U "yt-dlp[default]"   # [default] brings the EJS challenge solver; node on the runner runs it
      - name: probe
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          URL: ${{ inputs.url }}
        run: |
          mkdir -p data
          CK=""
          if [ -n "$YT_COOKIES" ]; then printf '%s\n' "$YT_COOKIES" > /tmp/yt_cookies.txt; chmod 600 /tmp/yt_cookies.txt; CK="--cookies /tmp/yt_cookies.txt"; fi
          { echo "probe $(date -u +%Y-%m-%dT%H:%MZ) $URL cookies=$([ -n "$CK" ] && echo yes || echo no)";
            yt-dlp --no-warnings $CK --print "%(title)s | %(duration)s s | %(uploader)s" --no-playlist "$URL" 2>&1 | tail -n 3;
            yt-dlp $CK --js-runtimes node -F --no-playlist "$URL" 2>&1 | grep -v "^\[download\]" | tail -n 25;
            yt-dlp --no-warnings $CK --js-runtimes node -f "bv*[height<=1080]+ba/b[height<=1080]/b" -S "res:1080,ext:mp4:m4a" --merge-output-format mp4 --no-playlist --download-sections "*0-20" -o "/tmp/probe.%(ext)s" "$URL" 2>&1 | tail -n 3;
            ls -la /tmp/probe.* 2>/dev/null && echo "DOWNLOAD OK" || echo "DOWNLOAD FAILED"; } | tee data/probe.log
      - name: save
        run: |
          git config user.name clipping-bot && git config user.email bot@users.noreply.github.com
          git add data/probe.log && (git diff --cached --quiet || (git commit -m "probe" && git pull --rebase origin main && git push))
