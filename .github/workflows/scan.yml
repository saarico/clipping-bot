name: scan
on:
  schedule:
    - cron: "23 * * * *"       # every hour: find campaigns, make 0_START/<campaign>/JOIN folders
  workflow_dispatch:
concurrency:
  group: clipping-scan
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: rclone + requests
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
          pip install -q requests
      - name: scan
        env:
          RCLONE_TOKEN: ${{ secrets.RCLONE_TOKEN }}
        run: |
          set -o pipefail
          python bot/campaign_scan.py 2>&1 | tee data/last_scan.log
      - name: save state
        if: always()
        run: |
          git config user.name "clipping-bot"
          git config user.email "clipping-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "scan $(date -u +%Y-%m-%d_%H:%M)" && git pull --rebase origin main && git push)
